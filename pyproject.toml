[project]
name = "practiscore-diplomas-generator"
version = "0.1.0"
description = "Parse PractiScore match exports for diploma generation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "python-docx>=1.1",
]

[project.scripts]
practiscore-diplomas = "practiscore_diplomas.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practiscore_diplomas"]

[tool.hatch.build.targets.wheel.force-include]
"src/practiscore_diplomas/assets/trash-solid.png" = "practiscore_diplomas/assets/trash-solid.png"
"src/practiscore_diplomas/assets/edit-pencil.png" = "practiscore_diplomas/assets/edit-pencil.png"
"src/practiscore_diplomas/assets/refresh-double.png" = "practiscore_diplomas/assets/refresh-double.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
