name: Build and Release Windows Package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $majorMinor = (Get-Content VERSION -Raw).Trim()
          if ($majorMinor -notmatch '^\d+\.\d+$') {
            throw "VERSION must contain major.minor, for example 0.1"
          }
          $version = "$majorMinor.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Build Windows release ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/practiscore-diplomas-generator-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Update latest release tag
        shell: pwsh
        run: |
          git tag --force latest ${{ github.sha }}
          git push --force origin refs/tags/latest

      - name: Update latest Windows package
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "dist/practiscore-diplomas-generator-${{ steps.version.outputs.version }}-windows-x64.zip" `
            -Destination "dist/practiscore-diplomas-generator-windows-x64.zip"

      - name: Update latest GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest release
          body: This release is updated automatically after every successful build on `main`.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: dist/practiscore-diplomas-generator-windows-x64.zip
